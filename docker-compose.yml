services:
  client_app:
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file:
      - .env
      
    depends_on:
      - core_microservice
    restart: unless-stopped

  auth_microservice:
    build:
      context: .
      dockerfile: apps/auth_microservice/Dockerfile
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - PORT=4001
    restart: unless-stopped

  core_microservice:
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    ports:
      - "4002:4002"
    env_file:
      - .env
    environment:
      - PORT=4002
    depends_on:
      - auth_microservice
    restart: unless-stopped

  notifications_consumer:
    build:
      context: .
      dockerfile: apps/notifications_consumer_microservice/Dockerfile
    env_file:
      - .env
    depends_on:
      - core_microservice
    restart: unless-stopped