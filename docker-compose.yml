services:
  client_app:
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://core_microservice:4002
    depends_on:
      - core_microservice
    restart: unless-stopped

  auth_microservice:
    build:
      context: .
      dockerfile: apps/auth_microservice/Dockerfile
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  core_microservice:
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth_microservice:4001
    depends_on:
      - auth_microservice
    restart: unless-stopped

  notifications_consumer:
    build:
      context: .
      dockerfile: apps/notifications_consumer_microservice/Dockerfile
    environment:
      - NODE_ENV=production
      - CORE_SERVICE_URL=http://core_microservice:4002
    depends_on:
      - core_microservice
    restart: unless-stopped