services:

  postgres:
    image: postgres:17-alpine
    container_name: innogram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-innogram}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-innogram}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - innogram

  auth_microservice:
    build:
      context: .
      dockerfile: apps/auth_microservice/Dockerfile
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - PORT=4001
      - DATABASE_URL: postgres://postgres:postgres@postgres:5432/innogram
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - innogram

  core_microservice:
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    ports:
      - "4002:4002"
    env_file:
      - .env
    environment:
      - PORT=4002
      - DATABASE_URL: postgres://postgres:postgres@postgres:5432/innogram
    restart: unless-stopped
    depends_on:
      auth_microservice:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - innogram

  notifications_consumer:
    build:
      context: .
      dockerfile: apps/notifications_consumer_microservice/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL: postgres://postgres:postgres@postgres:5432/innogram
    restart: unless-stopped
    depends_on:
      core_microservice:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - innogram

  client_app:
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      core_microservice:
        condition: service_started
    networks:
      - innogram

volumes:
  postgres_data:

networks:
  innogram:
    driver: bridge